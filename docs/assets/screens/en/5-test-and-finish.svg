<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 660 510" width="660" height="510" font-family="'Segoe UI', Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="470" rx="8" fill="#FFFFFF" stroke="#B4B4B4" stroke-width="1"/>
  <rect x="0" y="0" width="620" height="32" rx="8" fill="#F3F3F3"/>
  <rect x="0" y="20" width="620" height="12" rx="0" fill="#F3F3F3"/>
  <line x1="0" y1="32" x2="620" y2="32" stroke="#DCDCDC"/>
  <rect x="12" y="9" width="14" height="14" rx="3" fill="#4169E1"/>
  <text x="34" y="21" font-size="12" font-weight="normal" fill="#1B1B1B" text-anchor="start">Add Database</text>
  <text x="598" y="21" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">✕</text>
  <text x="554" y="21" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">☐</text>
  <text x="510" y="21" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">—</text>
  <rect x="18.5" y="50" width="30" height="30" rx="15" fill="#BED2F5"/>
  <text x="33.5" y="70" font-size="13" font-weight="bold" fill="#4169E1" text-anchor="middle">1</text>
  <text x="56.5" y="70" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">Connection Name</text>
  <rect x="181.5" y="50" width="30" height="30" rx="15" fill="#BED2F5"/>
  <text x="196.5" y="70" font-size="13" font-weight="bold" fill="#4169E1" text-anchor="middle">2</text>
  <text x="219.5" y="70" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">Server Details</text>
  <rect x="337.5" y="50" width="30" height="30" rx="15" fill="#BED2F5"/>
  <text x="352.5" y="70" font-size="13" font-weight="bold" fill="#4169E1" text-anchor="middle">3</text>
  <text x="375.5" y="70" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">Credentials</text>
  <rect x="472.5" y="50" width="30" height="30" rx="15" fill="#4169E1"/>
  <text x="487.5" y="70" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="510.5" y="70" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">Test &amp; Finish</text>
  <text x="24" y="132" font-size="22" font-weight="bold" fill="#1B1B1B" text-anchor="start">Test &amp; Finish</text>
  <text x="24" y="158" font-size="13" font-weight="normal" fill="#808080" text-anchor="start">Run a test before saving, so a typo doesn&#x27;t turn into a connection that never comes online.</text>
  <rect x="24" y="180" width="148" height="38" rx="4" fill="#FBFBFB" stroke="#D0D0D0" stroke-width="1"/>
  <text x="98.0" y="204.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="middle">Test Connection</text>
  <rect x="24" y="234" width="572" height="44" rx="4" fill="#F2FAF2" stroke="#CDE8CD" stroke-width="1"/>
  <text x="36" y="261" font-size="14" font-weight="normal" fill="#008000" text-anchor="start">Connection succeeded.</text>
  <rect x="296" y="414" width="90" height="36" rx="4" fill="#FBFBFB" stroke="#D0D0D0" stroke-width="1"/>
  <text x="341.0" y="437.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="middle">Cancel</text>
  <rect x="396" y="414" width="90" height="36" rx="4" fill="#FBFBFB" stroke="#D0D0D0" stroke-width="1"/>
  <text x="441.0" y="437.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="middle">Back</text>
  <rect x="496" y="414" width="100" height="36" rx="4" fill="#005FB8" stroke="#005FB8" stroke-width="1"/>
  <text x="546.0" y="437.0" font-size="13" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Finish</text>
  <rect x="20" y="176" width="156" height="46" rx="6" fill="none" stroke="#E5484D" stroke-width="3"/>
  <circle cx="176" cy="176" r="14" fill="#E5484D"/><text x="176" y="181" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="492" y="410" width="108" height="44" rx="6" fill="none" stroke="#E5484D" stroke-width="3"/>
  <circle cx="600" cy="410" r="14" fill="#E5484D"/><text x="600" y="415" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
</svg>
