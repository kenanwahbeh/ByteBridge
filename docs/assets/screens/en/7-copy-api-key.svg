<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 600 510" width="600" height="510" font-family="'Segoe UI', Tahoma, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="470" rx="8" fill="#FFFFFF" stroke="#B4B4B4" stroke-width="1"/>
  <rect x="0" y="0" width="560" height="32" rx="8" fill="#F3F3F3"/>
  <rect x="0" y="20" width="560" height="12" rx="0" fill="#F3F3F3"/>
  <line x1="0" y1="32" x2="560" y2="32" stroke="#DCDCDC"/>
  <rect x="12" y="9" width="14" height="14" rx="3" fill="#4169E1"/>
  <text x="34" y="21" font-size="12" font-weight="normal" fill="#1B1B1B" text-anchor="start">Web Server</text>
  <text x="538" y="21" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">✕</text>
  <text x="494" y="21" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">☐</text>
  <text x="450" y="21" font-size="12" font-weight="normal" fill="#444444" text-anchor="middle">—</text>
  <text x="24" y="72" font-size="16" font-weight="600" fill="#008000" text-anchor="start">● Answering — http://127.0.0.1:8080</text>
  <text x="24" y="96" font-size="13" font-weight="normal" fill="#808080" text-anchor="start">Service: running</text>
  <text x="24" y="120" font-size="12" font-weight="normal" fill="#808080" text-anchor="start">Point the tunnel here:  cloudflared tunnel --url http://127.0.0.1:8080</text>
  <text x="24" y="170" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="start">Port</text>
  <rect x="446" y="150" width="90" height="34" rx="4" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1"/>
  <line x1="447" y1="183" x2="535" y2="183" stroke="#8A8A8A"/>
  <text x="456" y="172.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">8080</text>
  <text x="24" y="222" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="start">Lock out after wrong keys</text>
  <text x="24" y="242" font-size="12" font-weight="normal" fill="#808080" text-anchor="start">How many wrong API keys one caller may send within 60 seconds</text>
  <text x="24" y="258" font-size="12" font-weight="normal" fill="#808080" text-anchor="start">before being refused for a while. 0 turns it off.</text>
  <rect x="446" y="214" width="90" height="34" rx="4" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1"/>
  <line x1="447" y1="247" x2="535" y2="247" stroke="#8A8A8A"/>
  <text x="456" y="236.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">10</text>
  <text x="24" y="306" font-size="15" font-weight="600" fill="#1B1B1B" text-anchor="start">Lock out for (minutes)</text>
  <rect x="446" y="286" width="90" height="34" rx="4" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1"/>
  <line x1="447" y1="319" x2="535" y2="319" stroke="#8A8A8A"/>
  <text x="456" y="308.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="start">1</text>
  <rect x="24" y="338" width="120" height="32" rx="4" fill="#FBFBFB" stroke="#D0D0D0" stroke-width="1"/>
  <text x="84.0" y="359.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="middle">Copy API Key</text>
  <rect x="152" y="338" width="82" height="32" rx="4" fill="#FBFBFB" stroke="#D0D0D0" stroke-width="1"/>
  <text x="193.0" y="359.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="middle">New Key</text>
  <rect x="326" y="410" width="90" height="36" rx="4" fill="#FBFBFB" stroke="#D0D0D0" stroke-width="1"/>
  <text x="371.0" y="433.0" font-size="13" font-weight="normal" fill="#1B1B1B" text-anchor="middle">Done</text>
  <rect x="426" y="410" width="110" height="36" rx="4" fill="#005FB8" stroke="#005FB8" stroke-width="1"/>
  <text x="481.0" y="433.0" font-size="13" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Turn Off</text>
  <rect x="20" y="334" width="128" height="40" rx="6" fill="none" stroke="#E5484D" stroke-width="3"/>
  <circle cx="148" cy="334" r="14" fill="#E5484D"/><text x="148" y="339" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
</svg>
